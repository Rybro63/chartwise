# Chartwise local stack.
#   docker compose up -d --build        # everything
#   make seed                           # load Synthea patients into HAPI FHIR
# UIs: review app http://localhost:3000, Grafana http://localhost:3001, Jaeger http://localhost:16686,
#      Prometheus http://localhost:9090, HAPI FHIR http://localhost:8090/fhir

name: chartwise

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chartwise
      POSTGRES_PASSWORD: chartwise
      POSTGRES_DB: chartwise
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartwise"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in encounter.created note.drafted note.approved chartwise.dead-letter; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 6 --replication-factor 1
        done
    restart: "no"

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  hapi:
    image: hapiproject/hapi:v8.12.0-1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: chartwise
      SPRING_DATASOURCE_PASSWORD: chartwise
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_SEARCH_ENABLED: "false"
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_CLIENT_ID_STRATEGY: ANY
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
      HAPI_FHIR_BYPASS_VALIDATION: "true"
    ports: ["8090:8080"]

  encounter-service:
    build: ./services/encounter-service
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chartwise
      DB_USER: chartwise
      DB_PASSWORD: chartwise
      KAFKA_BOOTSTRAP: kafka:9092
      FHIR_BASE_URL: http://hapi:8080/fhir
      OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      DRAFT_SLO: ${DRAFT_SLO:-30s}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      retries: 40

  llm-gateway:
    build: ./services/llm-gateway
    depends_on:
      redis: { condition: service_healthy }
    environment:
      <<: *otel
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      FAKE_LATENCY: ${FAKE_LATENCY:-1500ms}
      FAKE_JITTER: ${FAKE_JITTER:-1000ms}
      FAKE_HALLUCINATION_RATE: ${FAKE_HALLUCINATION_RATE:-0.1}
      REDIS_ADDR: redis:6379
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-10}
      BREAKER_FAILURE_THRESHOLD: "5"
      BREAKER_OPEN_DURATION: 15s
      CHAOS_ENABLED: "true"
    ports: ["50051:50051", "8081:8081"]

  note-worker:
    build: ./services/note-worker
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      encounter-service: { condition: service_healthy }
      llm-gateway: { condition: service_started }
    environment:
      <<: *otel
      KAFKA_BOOTSTRAP: kafka:9092
      ENCOUNTER_SERVICE_URL: http://encounter-service:8080
      GATEWAY_TARGET: llm-gateway:50051
      BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    # Metrics on :9100 are scraped over the compose network (no host port, so the worker can scale).
    expose: ["9100"]
    restart: unless-stopped

  review-app:
    build: ./apps/review-app
    depends_on: [encounter-service]
    ports: ["3000:8080"]

  # ---- observability ----

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/compose/otel/config.yaml:/etc/otel/config.yaml:ro
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports: ["16686:16686"]

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./deploy/compose/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  kafkadata:
