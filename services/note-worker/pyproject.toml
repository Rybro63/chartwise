[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "note-worker"
version = "0.1.0"
description = "Chartwise note generation worker: drafts SOAP notes via the LLM gateway and safety-checks them."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka==2.15.1",
    "grpcio==1.84.0",
    "protobuf>=7.35.1,<8",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "prometheus-client==0.26.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation-grpc==0.66b0",
    "opentelemetry-instrumentation-httpx==0.66b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "testcontainers[kafka]>=4.10",
    "grpcio-tools==1.84.0",
    "matplotlib>=3.9",
]

[project.scripts]
note-worker = "note_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs Docker (Testcontainers)"]
