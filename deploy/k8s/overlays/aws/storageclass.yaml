# EKS has no default StorageClass, so without this the Kafka volume claim stays Pending.
# reclaimPolicy Delete: removing the claim deletes the EBS volume (see down.sh).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
