receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  # Defence in depth: drop span attributes that could carry PHI if an instrumentation ever adds them.
  attributes/scrub:
    actions:
      - { key: http.request.body, action: delete }
      - { key: db.statement, action: delete }
      - { key: messaging.kafka.message.value, action: delete }

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [otlp/jaeger]
