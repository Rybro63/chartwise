global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: encounter-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["encounter-service:8080"] }]
  - job_name: llm-gateway
    static_configs: [{ targets: ["llm-gateway:8081"] }]
  - job_name: note-worker
    # DNS service discovery picks up every replica after `docker compose up --scale note-worker=N`.
    dns_sd_configs:
      - names: ["note-worker"]
        type: A
        port: 9100
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
